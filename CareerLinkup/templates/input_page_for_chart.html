{% extends "base.html" %}
{% set title = "CareerLinkup | Salary growth comparison" %}

{% block container %}
<section class="page-section">
    <div class="container form-shell">
        <div class="text-center mb-4">
            <span class="eyebrow">Insights</span>
            <h1 class="page-title">Salary growth comparison</h1>
            <p class="lead-text">Enter your current salary to see how it compares with the roles posted here.</p>
        </div>
        <form class="form-card" method="POST" action="{{ url_for('main.salary_growth_comparison') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="current_salary" class="form-label">Your current salary (CAD)</label>
            <input type="number" step="0.01" min="0" name="current_salary" id="current_salary" class="form-control" placeholder="75000" required>
            <button type="submit" class="btn btn-brand btn-lg w-100 mt-4">Compare</button>
        </form>
    </div>
</section>
{% endblock %}

{% block script %}{% endblock %}
