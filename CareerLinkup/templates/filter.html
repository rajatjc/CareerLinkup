{% extends "base.html" %}
{% set title = "CareerLinkup | Company insights" %}

{% block container %}
<section class="page-section">
    <div class="container">
        <div class="text-center mb-4">
            <span class="eyebrow">Insights</span>
            <h1 class="page-title">Find a company</h1>
            <p class="lead-text">Filter employers by name, city or tagline. Leave a field empty to ignore it.</p>
        </div>

        <form id="filterForm" class="form-card filter-bar mb-4">
            <div>
                <label class="form-label" for="name">Name</label>
                <input class="form-control" type="text" id="name" name="name" placeholder="Northwind">
            </div>
            <div>
                <label class="form-label" for="location">Location</label>
                <input class="form-control" type="text" id="location" name="location" placeholder="Montreal">
            </div>
            <div>
                <label class="form-label" for="tagline">Tagline</label>
                <input class="form-control" type="text" id="tagline" name="tagline" placeholder="Data tools">
            </div>
            <button class="btn btn-brand" type="submit">Apply filter</button>
        </form>

        <div id="results" aria-live="polite"></div>
    </div>
</section>
{% endblock %}

{% block script %}
<script>
        document.getElementById("filterForm").addEventListener("submit", function(event) {
            event.preventDefault();
            applyFilter();
        });

        function applyFilter() {
            const name = document.getElementById("name").value;
            const location = document.getElementById("location").value;
            const tagline = document.getElementById("tagline").value;

            // Send the filter parameters to the Flask backend using fetch API or AJAX
            fetch("/filter_employers", {
                method: "POST",
                body: JSON.stringify({ name, location, tagline }),
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token() }}"
                }
            })
            .then(response => response.json())
            .then(data => displayTable(data));
        }

        function displayTable(data) {
            // Display the filtered results as a table on the page
            const resultsContainer = document.getElementById("results");
            resultsContainer.innerHTML = "";

            if (data.length === 0) {
                resultsContainer.innerHTML = "<p class=\"text-muted text-center\">No results found.</p>";
                return;
            }

            const table = document.createElement("table");
            table.className = "data-table";
            const tableHeader = document.createElement("thead");
            const headerRow = document.createElement("tr");
            const headers = ["Name", "Location", "Tagline"]; // Add more headers as needed

            headers.forEach(headerText => {
                const headerCell = document.createElement("th");
                headerCell.textContent = headerText;
                headerRow.appendChild(headerCell);
            });

            tableHeader.appendChild(headerRow);
            table.appendChild(tableHeader);

            const tableBody = document.createElement("tbody");

            data.forEach((employer, index) => {
                const row = document.createElement("tr");


                // Add data cells for each column
                const nameCell = document.createElement("td");
                nameCell.textContent = employer.name;
                row.appendChild(nameCell);

                const locationCell = document.createElement("td");
                locationCell.textContent = employer.location;
                row.appendChild(locationCell);

                const taglineCell = document.createElement("td");
                taglineCell.textContent = employer.tagline;
                row.appendChild(taglineCell);

                // Add more data cells for additional columns if needed

                tableBody.appendChild(row);
            });

            table.appendChild(tableBody);
            resultsContainer.appendChild(table);
        }
    </script>
{% endblock %}
