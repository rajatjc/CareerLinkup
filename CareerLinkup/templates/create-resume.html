{% extends 'base.html' %}

{% block container %}
<section class="page-section">
    <div class="container form-shell reveal">
        <div class="text-center mb-4">
            <span class="eyebrow">Resume builder</span>
            <h1 class="page-title">Create your resume</h1>
            <p class="lead-text">Fill in the details and download a tidy PDF. Nothing is saved.</p>
        </div>

        <form class="form-card" method="POST" action="{{ url_for('applicant.create_resume') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label" for="name">Full name</label>
                    <input class="form-control" type="text" name="name" id="name" placeholder="Ada Lovelace" autocomplete="name" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" type="email" name="email" id="email" placeholder="ada@example.com" autocomplete="email" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="phone">Phone</label>
                    <input class="form-control" type="text" name="phone" id="phone" placeholder="514 555 0199" autocomplete="tel" required>
                </div>
                <div class="col-12">
                    <label class="form-label" for="summary">Summary</label>
                    <textarea class="form-control" name="summary" id="summary" rows="4" placeholder="Two or three lines on who you are and what you do best." required></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label" for="education">Education</label>
                    <textarea class="form-control" name="education" id="education" rows="4" placeholder="Degree, school, years" required></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label" for="experience">Experience</label>
                    <textarea class="form-control" name="experience" id="experience" rows="6" placeholder="Role, company, years, and what you achieved" required></textarea>
                </div>
            </div>

            <button class="btn btn-brand btn-lg w-100 mt-4" type="submit"><i class="fa fa-download me-2" aria-hidden="true"></i>Create resume</button>
        </form>
    </div>
</section>
{% endblock %}
{% block script %}{% endblock %}
