<section id="find-jobs" class="text-light text-center">
    <div class="container">
        <h2 class="m-0">Find your next role</h2>
        <p class="lead">Search by title or category, and narrow by city.</p>
        <form class="search-form search-bar" action="{{ url_for('jobs.job_search') }}" method="post">
            {{ form1.hidden_tag() }}
            <label class="field">
                <i class="fa fa-search" aria-hidden="true"></i>
                <input type="text" placeholder="Job title or category" class="form-control" name="title" aria-label="Job title or category" required>
            </label>
            <label class="field">
                <i class="fa fa-map-marker" aria-hidden="true"></i>
                <input type="text" name="location" placeholder="Location" class="form-control" aria-label="Location">
            </label>
            <button type="submit" class="btn btn-brand">Search</button>
        </form>
    </div>
</section>
