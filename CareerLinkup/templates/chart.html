{% extends "base.html" %}
{% set title = "CareerLinkup | Salary growth" %}

{% block container %}
<section class="page-section">
    <div class="container">
        <div class="text-center mb-4">
            <span class="eyebrow">Insights</span>
            <h1 class="page-title">Salary growth chart</h1>
        </div>
        <div class="chart-card">
            <img src="data:image/png;base64,{{ chart_data }}" alt="Salary growth chart">
        </div>
        <p class="text-center mt-4"><a class="btn btn-outline-dark" href="{{ url_for('main.salary_growth_comparison') }}">Try another salary</a></p>
    </div>
</section>
{% endblock %}

{% block script %}{% endblock %}
