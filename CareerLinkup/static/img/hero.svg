<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" role="img" aria-label="Job listings with a shortlisted applicant">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#312e81" flood-opacity=".22"/>
    </filter>
  </defs>

  <circle cx="300" cy="250" r="200" fill="#eef2ff"/>
  <circle cx="470" cy="90" r="46" fill="url(#g2)" opacity=".55"/>
  <circle cx="60" cy="390" r="30" fill="url(#g2)" opacity=".5"/>

  <!-- main window -->
  <g filter="url(#sh)">
    <rect x="70" y="60" width="400" height="330" rx="20" fill="#fff"/>
  </g>
  <rect x="70" y="60" width="400" height="44" rx="20" fill="#f8fafc"/>
  <rect x="70" y="84" width="400" height="20" fill="#f8fafc"/>
  <circle cx="96" cy="82" r="5" fill="#fca5a5"/>
  <circle cx="114" cy="82" r="5" fill="#fcd34d"/>
  <circle cx="132" cy="82" r="5" fill="#86efac"/>
  <rect x="170" y="73" width="200" height="18" rx="9" fill="#e5e7eb"/>

  <!-- search bar -->
  <rect x="94" y="122" width="352" height="40" rx="20" fill="#f3f4f6"/>
  <circle cx="116" cy="142" r="7" fill="none" stroke="#9ca3af" stroke-width="2.5"/>
  <line x1="121" y1="147" x2="127" y2="153" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="138" y="136" width="110" height="12" rx="6" fill="#d1d5db"/>
  <rect x="368" y="128" width="70" height="28" rx="14" fill="url(#g1)"/>

  <!-- job rows -->
  <g>
    <rect x="94" y="182" width="352" height="62" rx="14" fill="#fff" stroke="#e5e7eb"/>
    <rect x="108" y="196" width="34" height="34" rx="10" fill="url(#g1)"/>
    <rect x="156" y="198" width="130" height="11" rx="5.5" fill="#1f2937"/>
    <rect x="156" y="218" width="84" height="9" rx="4.5" fill="#9ca3af"/>
    <rect x="378" y="203" width="52" height="22" rx="11" fill="#eef2ff"/>
    <rect x="388" y="211" width="32" height="6" rx="3" fill="#6366f1"/>
  </g>
  <g>
    <rect x="94" y="256" width="352" height="62" rx="14" fill="#fff" stroke="#c7d2fe"/>
    <rect x="108" y="270" width="34" height="34" rx="10" fill="#10b981"/>
    <rect x="156" y="272" width="150" height="11" rx="5.5" fill="#1f2937"/>
    <rect x="156" y="292" width="96" height="9" rx="4.5" fill="#9ca3af"/>
    <rect x="378" y="277" width="52" height="22" rx="11" fill="#eef2ff"/>
    <rect x="388" y="285" width="32" height="6" rx="3" fill="#6366f1"/>
  </g>
  <g opacity=".75">
    <rect x="94" y="330" width="352" height="46" rx="14" fill="#fff" stroke="#e5e7eb"/>
    <rect x="108" y="342" width="22" height="22" rx="7" fill="#f59e0b"/>
    <rect x="144" y="345" width="110" height="10" rx="5" fill="#1f2937"/>
    <rect x="144" y="360" width="70" height="7" rx="3.5" fill="#9ca3af"/>
  </g>

  <!-- floating: shortlisted -->
  <g class="float-a" filter="url(#sh)">
    <rect x="360" y="330" width="176" height="64" rx="16" fill="#fff"/>
    <circle cx="392" cy="362" r="17" fill="#d1fae5"/>
    <path d="M384 362 l6 6 l11 -12" fill="none" stroke="#059669" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="418" y="348" width="96" height="10" rx="5" fill="#1f2937"/>
    <rect x="418" y="366" width="64" height="8" rx="4" fill="#9ca3af"/>
  </g>

  <!-- floating: applicants -->
  <g class="float-b" filter="url(#sh)">
    <rect x="26" y="190" width="132" height="74" rx="16" fill="#fff"/>
    <circle cx="58" cy="216" r="14" fill="#fcd34d"/>
    <circle cx="82" cy="216" r="14" fill="#a5b4fc"/>
    <circle cx="106" cy="216" r="14" fill="#6ee7b7"/>
    <rect x="44" y="240" width="84" height="9" rx="4.5" fill="#9ca3af"/>
  </g>
</svg>
