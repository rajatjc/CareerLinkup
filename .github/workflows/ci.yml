name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t careerlinkup .
      - name: Start it and check the home page answers
        run: |
          docker run -d --name app -p 8000:8000 -e SECRET_KEY=ci careerlinkup
          for i in $(seq 1 20); do curl -fsS http://localhost:8000/ >/dev/null && exit 0; sleep 1; done
          docker logs app
          exit 1
